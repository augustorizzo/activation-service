spring.application.name=activation-service

provider.base-url=${PROVIDER_BASE_URL:http://localhost:9090}
provider.connect-timeout-ms=${PROVIDER_CONNECT_TIMEOUT_MS:1000}
provider.read-timeout-ms=${PROVIDER_READ_TIMEOUT_MS:2000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.jpa.open-in-view=false

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n